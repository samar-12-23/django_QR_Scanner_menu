<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code for Digital Restaurant Menu</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-teritiary">
        <div class="container">
            <a class="navbar-brand" href="#">QR Code Generator</a>

        </div>
    </nav>

    <!-- QR Code Result -->
    <div class="container mt-5 align-items-center text-center">
        <h2>Generated QR Code for {{ restaurant_name }} Menu</h2>
        <div class="mt-4">
            <img src="{{ qr_url }}" alt="QR Code" class="img-fluid" style="border: 1px solid #ddd; padding: 10px; background-color: #f8f9fa;">
        </div>
        <div>
            <a href="{{ qr_url }}" download="qr_code.png" class="btn btn-primary mt-3">Download QR Code</a>
            <br>
            <small>Scan the QR code to view the digital menu.</small>
        <div>
        
    </div>
</body> 
</html>
